name: Catalogue pages in sync

# /projects/, /games/ and /experiments/ are rendered from catalogue.json by
# scripts/build-pages.mjs and committed. This fails a PR that edits the
# catalogue or the template without re-running `npm run build:pages`.

# Notebook PRs (blog/**) don't trigger it: the homepage's notebook list goes
# stale between builds by design, and deploy.yml re-renders it on every push.
on:
  pull_request:
    paths:
      - "catalogue.json"
      - "scripts/build-pages.mjs"
      - "index.html"
      - "projects/**"
      - "games/**"
      - "experiments/**"
      - ".github/workflows/pages-check.yml"

jobs:
  pages-check:
    name: rendered pages match catalogue.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate catalogue.json
        run: node -e "JSON.parse(require('fs').readFileSync('catalogue.json','utf8'))"
      - name: Check rendered pages
        run: node scripts/build-pages.mjs --check
