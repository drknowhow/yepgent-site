name: Catalogue pages in sync

# scripts/build-pages.mjs renders the homepage, /projects/, /games/,
# /experiments/ and /blog/ from catalogue.json and blog/index.json. It also
# fills the <!-- fn:NAME --> regions (shared head, nav, footer, entry links)
# in every notebook post and in every other page that carries them, and the
# /dl/ file list from dl/ and dl/SHA256SUMS.txt, and writes sitemap.xml. This
# fails a PR that changes any of them without re-running `npm run build:pages`. deploy.yml also
# re-renders on every push to main.

on:
  pull_request:
    paths:
      - "catalogue.json"
      - "scripts/build-pages.mjs"
      - "scripts/refresh-catalogue*.mjs"
      - "**.html"
      - "blog/**"
      - "dl/**"
      - "sitemap.xml"
      - ".github/workflows/pages-check.yml"

jobs:
  pages-check:
    name: rendered pages match catalogue.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate catalogue.json
        run: node -e "JSON.parse(require('fs').readFileSync('catalogue.json','utf8'))"
      - name: Check rendered pages
        run: node scripts/build-pages.mjs --check
      - name: Test the catalogue refresh rules
        run: node --test scripts/refresh-catalogue.test.mjs
