name: Deploy to Netlify

on:
  push:
    branches: [main]
  # Daily: pick up new releases and pushes in the repos catalogue.json lists.
  schedule:
    - cron: '17 11 * * *'
  workflow_dispatch:

# A scheduled run and a push can overlap; deploy them one at a time, in order.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # Scheduled runs only: refresh catalogue.json from GitHub and PyPI and
  # compare it with the live one. The deploy job below runs on a schedule only
  # when they differ; a push or a manual run always deploys.
  check:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.refresh.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Compare the refreshed catalogue with the live one
        id: refresh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/refresh-catalogue.mjs --dry-run --compare

  deploy:
    needs: check
    if: ${{ !cancelled() && (github.event_name != 'schedule' || needs.check.outputs.changed == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      NETLIFY_MUSIC_SITE_ID: ${{ secrets.NETLIFY_MUSIC_SITE_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies (Functions runtime)
        run: npm ci || npm install

      - name: Generate js/config.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: npm run build:config

      # Generate gallery/catalog.json into the deployed dir. The Netlify
      # build plugins in netlify.toml never run here — `netlify deploy
      # --dir .` ships a prebuilt directory and skips `netlify build` —
      # so the catalog must be produced explicitly as a CI step.
      - name: Generate gallery/catalog.json
        run: npm run build:catalog

      # Fill in each project's version, release day and last push from GitHub
      # releases and PyPI. Failed lookups fall back to the live catalogue and
      # never fail the step. The result is deployed, not committed.
      - name: Refresh catalogue.json
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run refresh:catalogue

      # Render /projects/, /games/ and /experiments/ from catalogue.json so
      # production always matches the catalogue, even after a direct push.
      - name: Render catalogue pages
        run: npm run build:pages

      # Pinned to v17 — matches toolspace-site (working). `@latest` (v18+)
      # broke env-only auth and started returning
      # `Unauthorized: could not retrieve project` against valid tokens.
      - name: Install Netlify CLI
        run: npm install --global netlify-cli@17

      - name: Deploy to Netlify (production)
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          netlify deploy \
            --site "$NETLIFY_SITE_ID" \
            --auth "$NETLIFY_AUTH_TOKEN" \
            --dir . \
            --prod \
            --message "Deploy ${{ github.sha }} from ${{ github.ref_name }}"

      # music.yepgent.com — separate Netlify site, same repo, music/ subdir.
      # Requires: NETLIFY_MUSIC_SITE_ID secret set in GitHub repo settings.
      # Setup: create site at app.netlify.com → copy site ID → add secret.
      # DNS: add CNAME music → <music-site-name>.netlify.app at GoDaddy.
      - name: Deploy music.yepgent.com (production)
        # The daily run changes nothing the music site serves.
        if: ${{ env.NETLIFY_MUSIC_SITE_ID != '' && github.event_name != 'schedule' }}
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          # The music page lives at yepgent.com/music/ (its canonical URL) and
          # uses the main site's shell, so the subdomain 301s the page there.
          # It keeps serving catalog.json and llms.txt, which /music/ tells
          # agents to fetch from music.yepgent.com. The CLI applies the repo-root
          # netlify.toml to this site as well, so music/netlify.toml is never
          # read; these two files are what the subdomain gets.
          printf '/            https://yepgent.com/music/  301!\n/index.html  https://yepgent.com/music/  301!\n' > music/_redirects
          printf '/catalog.json\n  Access-Control-Allow-Origin: *\n  Content-Type: application/json; charset=utf-8\n/llms.txt\n  Access-Control-Allow-Origin: *\n  Content-Type: text/plain; charset=utf-8\n' > music/_headers
          netlify deploy \
            --site "$NETLIFY_MUSIC_SITE_ID" \
            --auth "$NETLIFY_AUTH_TOKEN" \
            --dir music \
            --prod \
            --message "music: deploy ${{ github.sha }} from ${{ github.ref_name }}"
